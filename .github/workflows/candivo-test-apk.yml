name: Build Candivo v0.12.1 test APK

on:
  push:
    branches: [ candivo-v0110-test-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare v0.12.1 branding and lobby UI
        shell: bash
        run: |
          set -euo pipefail
          base64 -d candivo/branding/candivo-old-logo.webp.b64 > candivo/app/src/main/res/drawable/candivo_old_logo.webp
          node --check candivo/app/src/main/assets/ui-v012.js
          cat candivo/app/src/main/assets/ui-v012.js >> candivo/app/src/main/assets/monetization.js
          grep -q 'candivoLeaderHero' candivo/app/src/main/assets/monetization.js
          grep -q 'candivoV0121' candivo/app/src/main/assets/monetization.js
          test -s candivo/app/src/main/res/drawable/candivo_old_logo.webp

      - name: Improve test ad preload retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('candivo/app/src/main/java/com/haber73/candivo/MainActivity.java')
          s=p.read_text()
          old='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                rewardedAd = null;\n                Log.w(TAG, "Rewarded load: " + error);\n            }'''
          new='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                rewardedAd = null;\n                Log.w(TAG, "Rewarded load: " + error);\n                if (webView != null) webView.postDelayed(() -> loadRewarded(), 3000);\n            }'''
          if old not in s:
              raise SystemExit('Rewarded callback patch target missing')
          s=s.replace(old,new,1)
          old2='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                interstitialAd = null;\n                Log.w(TAG, "Interstitial load: " + error);\n            }'''
          new2='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                interstitialAd = null;\n                Log.w(TAG, "Interstitial load: " + error);\n                if (webView != null) webView.postDelayed(() -> loadInterstitial(), 6000);\n            }'''
          if old2 not in s:
              raise SystemExit('Interstitial callback patch target missing')
          p.write_text(s.replace(old2,new2,1))
          PY

      - name: Package Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: signing-tools
          if-no-files-found: error

      - name: Verify test configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CandivoAndroid.showRewarded' candivo/app/src/main/assets/monetization.js
          grep -q 'candivoLeaderHero' candivo/app/src/main/assets/monetization.js
          grep -q 'candivoV0121' candivo/app/src/main/assets/monetization.js
          grep -q "versionCode 23" candivo/app/build.gradle
          grep -q "0.12.1-test" candivo/app/build.gradle
          grep -q '@drawable/candivo_old_logo' candivo/app/src/main/AndroidManifest.xml
          grep -q 'https://www.73haber.com.tr/candivo/' candivo/app/src/main/java/com/haber73/candivo/MainActivity.java

      - name: Build debug APK
        working-directory: candivo
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f candivo/app/build/outputs/apk/debug/app-debug.apk
          ls -lh candivo/app/build/outputs/apk/debug/app-debug.apk
          sha256sum candivo/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Candivo-v0.12.1-test-apk
          path: candivo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
