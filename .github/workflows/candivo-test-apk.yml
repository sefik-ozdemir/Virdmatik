name: Build Candivo v0.13.0 test APK

on:
  push:
    branches: [ candivo-v0110-test-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare v0.13 lobby, profiles and duel fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d candivo/branding/candivo-old-logo.webp.b64 > candivo/app/src/main/res/drawable/candivo_old_logo.webp
          base64 -d candivo/patches/ui-v013.js.gz.b64 | gzip -d > candivo/app/src/main/assets/ui-v013.js
          base64 -d candivo/patches/gameplay-v013.js.gz.b64 | gzip -d > candivo/app/src/main/assets/gameplay-v013.js
          cat candivo/patches/firebase-v013.part0* | base64 -d | gzip -d > candivo/app/src/main/assets/firebase-candivo.js
          node --check candivo/app/src/main/assets/ui-v013.js
          node --check candivo/app/src/main/assets/gameplay-v013.js
          node --check candivo/app/src/main/assets/firebase-candivo.js
          cat candivo/app/src/main/assets/ui-v013.js >> candivo/app/src/main/assets/monetization.js
          cat candivo/app/src/main/assets/gameplay-v013.js >> candivo/app/src/main/assets/monetization.js
          grep -q 'candivoLeaderHero' candivo/app/src/main/assets/monetization.js
          grep -q 'Hedef katkısı' candivo/app/src/main/assets/monetization.js
          grep -q 'showPublicProfile' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'expectedRound' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'settled.verified=true' candivo/app/src/main/assets/firebase-candivo.js

      - name: Patch WebView interception and ad preload retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('candivo/app/src/main/java/com/haber73/candivo/MainActivity.java')
          s=p.read_text()
          old='''            @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {\n                return openExternalIfNeeded(Uri.parse(url));\n            }\n\n            @Override public void onPageFinished(WebView view, String url) {'''
          new='''            @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {\n                return openExternalIfNeeded(Uri.parse(url));\n            }\n\n            @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\n                Uri uri = request.getUrl();\n                String path = uri == null ? null : uri.getPath();\n                if (isCandivoUrl(uri) && path != null && path.endsWith("/firebase-candivo.js")) {\n                    try {\n                        return new android.webkit.WebResourceResponse("application/javascript", "UTF-8", getAssets().open("firebase-candivo.js"));\n                    } catch (Exception error) {\n                        Log.e(TAG, "Local Firebase duel patch failed", error);\n                    }\n                }\n                return super.shouldInterceptRequest(view, request);\n            }\n\n            @Override public void onPageFinished(WebView view, String url) {'''
          if old not in s: raise SystemExit('WebView interceptor patch target missing')
          s=s.replace(old,new,1)
          old='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                rewardedAd = null;\n                Log.w(TAG, "Rewarded load: " + error);\n            }'''
          new='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                rewardedAd = null;\n                Log.w(TAG, "Rewarded load: " + error);\n                if (webView != null) webView.postDelayed(() -> loadRewarded(), 3000);\n            }'''
          if old not in s: raise SystemExit('Rewarded callback patch target missing')
          s=s.replace(old,new,1)
          old='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                interstitialAd = null;\n                Log.w(TAG, "Interstitial load: " + error);\n            }'''
          new='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                interstitialAd = null;\n                Log.w(TAG, "Interstitial load: " + error);\n                if (webView != null) webView.postDelayed(() -> loadInterstitial(), 6000);\n            }'''
          if old not in s: raise SystemExit('Interstitial callback patch target missing')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Package Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: signing-tools
          if-no-files-found: error

      - name: Verify test configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CandivoAndroid.showRewarded' candivo/app/src/main/assets/monetization.js
          grep -q 'candivoLeaderHero' candivo/app/src/main/assets/monetization.js
          grep -q 'Hedef katkısı' candivo/app/src/main/assets/monetization.js
          grep -q 'shouldInterceptRequest' candivo/app/src/main/java/com/haber73/candivo/MainActivity.java
          grep -q 'firebase-candivo.js' candivo/app/src/main/java/com/haber73/candivo/MainActivity.java
          grep -q 'expectedRound' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'settled.verified=true' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'showPublicProfile' candivo/app/src/main/assets/firebase-candivo.js
          grep -q "versionCode 24" candivo/app/build.gradle
          grep -q "0.13.0-test" candivo/app/build.gradle
          grep -q '@drawable/candivo_old_logo' candivo/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: candivo
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f candivo/app/build/outputs/apk/debug/app-debug.apk
          ls -lh candivo/app/build/outputs/apk/debug/app-debug.apk
          sha256sum candivo/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Candivo-v0.13.0-test-apk
          path: candivo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
