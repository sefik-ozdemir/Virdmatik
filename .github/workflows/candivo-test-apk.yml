name: Build Candivo v0.14.0 test APK

on:
  push:
    branches: [ candivo-v0140-use-this ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare v0.14 local patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candivo/app/src/main/assets candivo/app/src/main/res/drawable
          base64 -d candivo/branding/candivo-old-logo.webp.b64 > candivo/app/src/main/res/drawable/candivo_old_logo.webp
          base64 -d candivo/patches/ui-v013.js.gz.b64 | gzip -d > candivo/app/src/main/assets/ui-v014.js
          base64 -d candivo/patches/gameplay-v013.js.gz.b64 | gzip -d > candivo/app/src/main/assets/gameplay-v014.js
          cat candivo/patches/firebase-v013.part0* | base64 -d | gzip -d > candivo/app/src/main/assets/firebase-candivo.js
          node --check candivo/app/src/main/assets/ui-v014.js
          node --check candivo/app/src/main/assets/gameplay-v014.js
          node --check candivo/app/src/main/assets/firebase-candivo.js
          cat candivo/app/src/main/assets/ui-v014.js >> candivo/app/src/main/assets/monetization.js
          cat candivo/app/src/main/assets/gameplay-v014.js >> candivo/app/src/main/assets/monetization.js
          grep -q 'candivoLeaderHero' candivo/app/src/main/assets/monetization.js
          grep -q 'Hedef katkısı' candivo/app/src/main/assets/monetization.js
          grep -q 'CandivoOpenPublicProfile' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'candivo-profile-ready' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'rematchRoomId' candivo/app/src/main/assets/firebase-candivo.js

      - name: Patch Android shell and version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          g=Path('candivo/app/build.gradle')
          s=g.read_text()
          s=s.replace('versionCode 24','versionCode 25')
          s=s.replace("versionName '0.13.0-test'","versionName '0.14.0-test'")
          g.write_text(s)

          p=Path('candivo/app/src/main/java/com/haber73/candivo/MainActivity.java')
          s=p.read_text()
          old='''            @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {\n                return openExternalIfNeeded(Uri.parse(url));\n            }\n\n            @Override public void onPageFinished(WebView view, String url) {'''
          new='''            @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {\n                return openExternalIfNeeded(Uri.parse(url));\n            }\n\n            @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\n                Uri uri = request.getUrl();\n                String path = uri == null ? null : uri.getPath();\n                if (isCandivoUrl(uri) && path != null && path.endsWith("/firebase-candivo.js")) {\n                    try {\n                        return new android.webkit.WebResourceResponse("application/javascript", "UTF-8", getAssets().open("firebase-candivo.js"));\n                    } catch (Exception error) {\n                        Log.e(TAG, "Local Firebase v0.14 patch failed", error);\n                    }\n                }\n                return super.shouldInterceptRequest(view, request);\n            }\n\n            @Override public void onPageFinished(WebView view, String url) {'''
          if 'shouldInterceptRequest(WebView view, WebResourceRequest request)' not in s:
              if old not in s: raise SystemExit('WebView interceptor patch target missing')
              s=s.replace(old,new,1)

          old='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                rewardedAd = null;\n                Log.w(TAG, "Rewarded load: " + error);\n            }'''
          new='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                rewardedAd = null;\n                Log.w(TAG, "Rewarded load: " + error);\n                if (webView != null) webView.postDelayed(() -> loadRewarded(), 4000);\n            }'''
          if old in s: s=s.replace(old,new,1)

          old='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                interstitialAd = null;\n                Log.w(TAG, "Interstitial load: " + error);\n            }'''
          new='''            @Override public void onAdFailedToLoad(LoadAdError error) {\n                interstitialAd = null;\n                Log.w(TAG, "Interstitial load: " + error);\n                if (webView != null) webView.postDelayed(() -> loadInterstitial(), 7000);\n            }'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Verify v0.14 test configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'shouldInterceptRequest' candivo/app/src/main/java/com/haber73/candivo/MainActivity.java
          grep -q 'firebase-candivo.js' candivo/app/src/main/java/com/haber73/candivo/MainActivity.java
          grep -q "versionCode 25" candivo/app/build.gradle
          grep -q "0.14.0-test" candivo/app/build.gradle
          grep -q 'CandivoAndroid.showRewarded' candivo/app/src/main/assets/monetization.js
          grep -q 'candivoLeaderHero' candivo/app/src/main/assets/monetization.js
          grep -q 'CandivoOpenPublicProfile' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'candivo-profile-ready' candivo/app/src/main/assets/firebase-candivo.js
          grep -q 'rematchRoomId' candivo/app/src/main/assets/firebase-candivo.js
          grep -q '@drawable/candivo_old_logo' candivo/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: candivo
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f candivo/app/build/outputs/apk/debug/app-debug.apk
          ls -lh candivo/app/build/outputs/apk/debug/app-debug.apk
          sha256sum candivo/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Candivo-v0.14.0-test-apk
          path: candivo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
